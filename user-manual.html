        // Sets a submenu's max-height to its actual content height (when expanded)
        // or 0 (when collapsed), using an inline !important style so it always wins
        // over the CSS fallback (.submenu.expanded { max-height: 300px }), which is
        // too small once nested submenus are open.
        function setSubmenuHeight(submenu) {
            if (!submenu) return;
            if (submenu.classList.contains('expanded')) {
                submenu.style.setProperty('max-height', submenu.scrollHeight + 'px', 'important');
            } else {
                submenu.style.setProperty('max-height', '0px', 'important');
            }
        }
        
        // Walks up through any ancestor .submenu elements and, if they're expanded,
        // recalculates their height so a nested submenu opening/closing doesn't get
        // clipped by a parent submenu's own fixed max-height.
        function updateAncestorSubmenuHeights(el) {
            let parent = el.parentElement;
            while (parent) {
                if (parent.classList && parent.classList.contains('submenu')) {
                    setSubmenuHeight(parent);
                }
                parent = parent.parentElement;
            }
        }
        
        function toggleSubmenu(menuName) {
            expandedMenus[menuName] = !expandedMenus[menuName];
            const submenu = document.getElementById(`${menuName}-submenu`);
            const arrow = document.getElementById(`${menuName}-arrow`);
            if (expandedMenus[menuName]) {
                submenu.classList.add('expanded');
                arrow.classList.add('rotate');
                arrow.parentElement.classList.add('expanded');
            } else {
                submenu.classList.remove('expanded');
                arrow.classList.remove('rotate');
                arrow.parentElement.classList.remove('expanded');
            }
        
            setSubmenuHeight(submenu);
            updateAncestorSubmenuHeights(submenu);
        
            // The call above measures ancestor submenus' scrollHeight synchronously,
            // in the same tick that this submenu's own max-height transition just
            // started. At that instant the transition hasn't progressed yet, so any
            // ancestor's scrollHeight is measured *before* this submenu has actually
            // grown/shrunk - meaning the ancestor can get locked to a height that's
            // too small (clipping later items) or briefly wrong. Once this submenu's
            // own max-height transition finishes, re-measure the ancestors again so
            // they end up sized to the real, final content height.
            submenu.addEventListener('transitionend', function onDone(e) {
                if (e.propertyName === 'max-height') {
                    updateAncestorSubmenuHeights(submenu);
                    submenu.removeEventListener('transitionend', onDone);
                }
            });
        }

        async function checkAuthentication() {
            const cachedUserId = localStorage.getItem('user_id');
            let fullName = localStorage.getItem('full_name') || '';
            let email = localStorage.getItem('email') || '';
            let profilePicture = '';
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) overlay.style.display = 'flex';

            try {
                const res = await fetch(API_URL + '/main-settings.php', { credentials: 'include' });
                if (!res.ok) {
                    clearSessionAndRedirect();
                    if (overlay) overlay.style.display = 'none';
                    return false;
                }

                const json = await res.json();
                if (!json.success || !json.data) {
                    clearSessionAndRedirect();
                    if (overlay) overlay.style.display = 'none';
                    return false;
                }

                if (json.data.account_type === 'portal_user') {
                    window.location.href = 'school-portal-dashboard.html';
                    if (overlay) overlay.style.display = 'none';
                    return false;
                }

                if (json.data.id) localStorage.setItem('user_id', String(json.data.id));
                if (json.data.full_name) { fullName = json.data.full_name; localStorage.setItem('full_name', json.data.full_name); }
                if (json.data.email) { email = json.data.email; localStorage.setItem('email', json.data.email); }
                if (json.data.role) localStorage.setItem('role', json.data.role);
                if (json.data.account_type) localStorage.setItem('account_type', json.data.account_type);
                if (Array.isArray(json.data.permissions)) {
                    localStorage.setItem('permissions', JSON.stringify(json.data.permissions));
                }

                profilePicture = json.data.profile_picture || '';
            } catch (e) {
                if (!cachedUserId) {
                    clearSessionAndRedirect();
                    if (overlay) overlay.style.display = 'none';
                    return false;
                }
            }

            if (typeof Permissions !== 'undefined') {
                await Permissions.loadRolePermissions();
                Permissions.applyNavPermissions();
            }

            loadUserInfo(fullName, email, profilePicture);
            if (overlay) overlay.style.display = 'none';
            return true;
        }

            } finally {

            }

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderInline(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            return html;
        }

        function parseImageLine(line) {
            // Matches: ![alt](src) or ![alt](src "caption")
            const m = line.match(/^!\[([^\]]*)\]\(([^\s")]+)(?:\s+"([^"]*)")?\)$/);
            if (!m) return null;
            return { alt: m[1], src: m[2], caption: m[3] || m[1] };
        }

        function markdownToHtml(markdown) {
            const lines = markdown.split(/\r?\n/);
            const out = [];
            let inUl = false;
            let inOl = false;

            function closeLists() {
                if (inUl) {
                    out.push('</ul>');
                    inUl = false;
                }
                if (inOl) {
                    out.push('</ol>');
                    inOl = false;
                }
            }

            for (const rawLine of lines) {
                const line = rawLine.trim();

                if (!line) {
                    closeLists();
                    continue;
                }

                if (line.startsWith('![')) {
                    const img = parseImageLine(line);
                    if (img) {
                        closeLists();
                        out.push(
                            '<figure class="manual-figure">' +
                            '<img src="' + escapeHtml(img.src) + '?v3" alt="' + escapeHtml(img.alt) + '" loading="lazy">' +
                            (img.caption ? '<figcaption>' + escapeHtml(img.caption) + '</figcaption>' : '') +
                            '</figure>'
                        );
                        continue;
                    }
                }

                if (line.startsWith('### ')) {
                    closeLists();
                    out.push('<h3>' + renderInline(line.slice(4)) + '</h3>');
                    continue;
                }

                if (line.startsWith('## ')) {
                    closeLists();
                    out.push('<h2>' + renderInline(line.slice(3)) + '</h2>');
                    continue;
                }

                if (line.startsWith('# ')) {
                    closeLists();
                    out.push('<h1>' + renderInline(line.slice(2)) + '</h1>');
                    continue;
                }

                if (line.startsWith('- ')) {
                    if (inOl) {
                        out.push('</ol>');
                        inOl = false;
                    }
                    if (!inUl) {
                        out.push('<ul>');
                        inUl = true;
                    }
                    out.push('<li>' + renderInline(line.slice(2)) + '</li>');
                    continue;
                }

                if (/^\d+\.\s+/.test(line)) {
                    if (inUl) {
                        out.push('</ul>');
                        inUl = false;
                    }
                    if (!inOl) {
                        out.push('<ol>');
                        inOl = true;
                    }
                    out.push('<li>' + renderInline(line.replace(/^\d+\.\s+/, '')) + '</li>');
                    continue;
                }

                closeLists();
                out.push('<p>' + renderInline(line) + '</p>');
            }

            closeLists();
            return out.join('');
        }

        function getReferrerPageName() {
            if (!document.referrer) return '';
            try {
                const ref = new URL(document.referrer);
                if (ref.origin !== window.location.origin) return '';
                const parts = ref.pathname.split('/').filter(Boolean);
                return (parts[parts.length - 1] || '').toLowerCase();
            } catch {
                return '';
            }
        }

        function getHeadingText(line) {
            return line.replace(/^#{1,6}\s+/, '').trim();
        }

        function extractSection(markdown, headingMatcher) {
            const lines = markdown.split(/\r?\n/);
            const headingPattern = /^(#{1,6})\s+(.+)$/;
            let startIndex = -1;
            let startLevel = 7;

            for (let i = 0; i < lines.length; i += 1) {
                const m = lines[i].match(headingPattern);
                if (!m) continue;
                const heading = getHeadingText(lines[i]);
                if (headingMatcher.test(heading)) {
                    startIndex = i;
                    startLevel = m[1].length;
                    break;
                }
            }

            if (startIndex < 0) return null;

            let endIndex = lines.length;
            for (let i = startIndex + 1; i < lines.length; i += 1) {
                const m = lines[i].match(headingPattern);
                if (!m) continue;
                const level = m[1].length;
                if (level <= startLevel) {
                    endIndex = i;
                    break;
                }
            }

            return lines.slice(startIndex, endIndex).join('\n').trim();
        }

        function resolveSectionDefinition() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('view') === 'full') return null;

            const explicitSection = params.get('section');
            if (explicitSection) {
                const allowed = getAllowedSections();
                const foundBySection = allowed.find((item) => item.id === explicitSection);
                if (foundBySection) return foundBySection;
            }

            const pageParam = (params.get('page') || '').toLowerCase();
            const refPage = pageParam || getReferrerPageName();
            if (!refPage) return null;

            const allowed = getAllowedSections();
            return allowed.find((item) => item.page === refPage) || null;
        }

        async function loadManual() {
            const content = document.getElementById('manualContent');
            const context = document.getElementById('manualContext');
            const title = document.getElementById('manualTitle');
            const subtitle = document.getElementById('manualSubtitle');
            const focused = resolveSectionDefinition();
            const allowed = getAllowedSections();

            try {
                const response = await fetch('USER_MANUAL.md?ts=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error('Could not load USER_MANUAL.md');

                const markdown = await response.text();
                if (focused) {
                    const sectionMarkdown = extractSection(markdown, focused.heading);
                    if (sectionMarkdown) {
                        title.innerHTML = '<i class="fa-solid fa-circle-question"></i> ' + focused.title;
                        subtitle.textContent = focused.subtitle;
                        context.textContent = 'Focused help mode from header Help button.';
                        content.innerHTML = markdownToHtml(sectionMarkdown);
                        return;
                    }
                }

                if (!allowed.length) {
                    context.textContent = 'No manual sections available for your access.';
                    title.innerHTML = '<i class="fa-solid fa-book-open"></i>User Manual';
                    subtitle.textContent = 'Access to manual sections is based on your permissions.';
                    content.innerHTML = '<p class="error"><i class="fa-solid fa-circle-exclamation"></i> No manual sections are available for your account.</p>';
                    return;
                }

                const combined = allowed
                    .map(section => extractSection(markdown, section.heading))
                    .filter(Boolean)
                    .join('\n\n');

                if (!combined) {
                    context.textContent = 'No manual sections available for your access.';
                    title.innerHTML = '<i class="fa-solid fa-book-open"></i>User Manual';
                    subtitle.textContent = 'Access to manual sections is based on your permissions.';
                    content.innerHTML = '<p class="error"><i class="fa-solid fa-circle-exclamation"></i> No manual sections are available for your account.</p>';
                    return;
                }

                context.textContent = 'Full guide mode filtered by your permissions.';
                title.innerHTML = '<i class="fa-solid fa-book-open"></i>User Manual';
                subtitle.textContent = 'Practical guide for daily system usage and workflows.';
                content.innerHTML = markdownToHtml(combined);
            } catch (error) {
                content.innerHTML = '<p class="error"><i class="fa-solid fa-circle-exclamation"></i> Unable to load the manual right now.</p>';
                console.error(error);
            }
        }

        window.addEventListener('DOMContentLoaded', async function () {
            document.getElementById('sidebarBackdrop')?.addEventListener('click', closeMobileSidebar);
            document.getElementById('sidebarAvatar')?.addEventListener('click', function () {
                window.location.href = 'main-settings.html';
            });
            const ok = await checkAuthentication();
            if (ok) loadManual();
        });
    </script>
