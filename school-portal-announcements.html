<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>QATALYST - Announcements</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="css/school-portal-dashboard.css?v4">
    <link rel="stylesheet" href="css/school-portal-notifications.css" />
    <link rel="stylesheet" href="css/school-portal-announcements.css?v2" />
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<div class="main-container">

    <!-- ── Sidebar (copied from school-portal-dashboard.html — keep in sync) ── -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-section">
            <div class="logo-icon">Q</div>
            <div class="logo-text">
                <h1>QATALYST</h1>
                <p>School Portal</p>
            </div>
        </div>

        <div class="school-pill-sidebar">
            <div class="school-pill-label">Your School</div>
            <div class="school-pill-name" id="sidebarSchoolName">Loading...</div>
            <div class="school-pill-dist" id="sidebarDistrict">—</div>
        </div>

        <nav class="nav-menu">
            <div class="nav-section-label">Main</div>
            <button class="nav-btn" data-portal-nav="dashboard" onclick="window.location.href='school-portal-dashboard.html'">
                <i class="fa-solid fa-house nav-icon"></i><span>Dashboard</span>
            </button>
            <button class="nav-btn" data-portal-nav="submissions" onclick="window.location.href='school-portal-submissions.html'">
                <i class="fa-solid fa-folder-open nav-icon"></i><span>My Submissions</span>
                <span class="nav-badge" id="pendingBadge" style="display:none;"></span>
            </button>
            <button class="nav-btn" data-portal-nav="tracker" onclick="window.location.href='school-portal-tracker.html'">
                <i class="fa-solid fa-chart-gantt nav-icon"></i><span>Document Tracker</span>
            </button>

            <div class="nav-section-label">Tools</div>
            <button class="nav-btn" data-portal-nav="calendar" onclick="window.location.href='school-portal-calendar.html'">
                <i class="fa-solid fa-calendar-days nav-icon"></i><span>School Calendar</span>
            </button>
            <button class="nav-btn" data-portal-nav="tuition" onclick="window.location.href='school-portal-tuition.html'">
                <i class="fa-solid fa-file-invoice-dollar nav-icon"></i><span>School Tuition Fee</span>
            </button>
            <button class="nav-btn" data-portal-nav="permit" onclick="window.location.href='school-portal-permit.html'">
                <i class="fa-solid fa-file-shield nav-icon"></i><span>School Permit</span>
            </button>

            <div class="nav-section-label">Account</div>
            <!-- NEW: Announcements nav item — visible to all portal users, no gating -->
            <button class="nav-btn active" data-portal-nav="announcements" onclick="window.location.href='school-portal-announcements.html'">
                <i class="fa-solid fa-bullhorn nav-icon"></i><span>Announcements</span>
                <span class="nav-badge" id="announcementsBadge" style="display:none;"></span>
            </button>
            <button class="nav-btn" data-portal-nav="audit" onclick="window.location.href='school-portal-audit.html'">
                <i class="fa-solid fa-clipboard-list nav-icon"></i>
                <span>Audit Logs</span>
            </button>
            <button class="nav-btn" data-portal-nav="profile" onclick="window.location.href='school-portal-profile.html'">
                <i class="fa-solid fa-user-circle nav-icon"></i><span>Profile</span>
            </button>
        </nav>

        <div class="user-info-sidebar">
            <div class="user-avatar-sidebar" id="sidebarAvatar">?</div>
            <div class="user-details">
                <h3 id="sidebarName">Loading...</h3>
                <p id="sidebarRole">—</p>
            </div>
        </div>
        <button class="sidebar-logout-btn" onclick="handleLogout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </button>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <!-- ── Main Content ── -->
    <div class="main-content">

        <div class="page-header">
            <div class="page-header-left">
                <h1><i class="fa-solid fa-bullhorn"></i> Announcements</h1>
                <p>Updates and notices from the Schools Division Office</p>
            </div>
            <div class="page-header-right">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <div class="dashboard-content">
            <div id="annStatsBar" class="ann-stats-bar" style="display:none;"></div>
            <div id="announcementsList" class="ann-list">
                <div class="ann-empty-state ann-empty-loading">
                    <div class="ann-empty-icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
                    <h3>Loading announcements</h3>
                    <p>Just a moment while we get the latest updates.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/config.js?v5"></script>
<script src="js/school-portal-permissions.js"></script>
<script src="js/school-portal-announcements.js?v5"></script>
<script src="js/school-portal-notifications.js"></script>
</body>
</html>
